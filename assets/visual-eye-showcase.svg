<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
<title id="title">Visual Eye — See more. Smile more.</title>
<desc id="desc">Promotional artwork showing the Visual Eye desktop Offline Agent and mobile ChatGPT companion side by side.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#06143d"/><stop offset=".55" stop-color="#073d86"/><stop offset="1" stop-color="#020b27"/></linearGradient>
 <linearGradient id="cyan" x2="1" y2="1"><stop stop-color="#38e7ff"/><stop offset="1" stop-color="#1765ff"/></linearGradient>
 <linearGradient id="purple" x2="1" y2="1"><stop stop-color="#a855f7"/><stop offset="1" stop-color="#5b21b6"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1440" height="810" rx="28" fill="url(#bg)"/>
<circle cx="1200" cy="100" r="230" fill="#087dff" opacity=".12"/><circle cx="220" cy="700" r="260" fill="#00d9ff" opacity=".08"/>
<g fill="none" stroke="#20cfff" opacity=".25"><path d="M0 610 Q360 500 720 610 T1440 590"/><path d="M0 650 Q360 540 720 650 T1440 630"/></g>
<g transform="translate(72 54)">
 <path d="M0 48 Q62 -8 124 48 Q62 105 0 48Z" fill="none" stroke="url(#cyan)" stroke-width="10"/>
 <circle cx="62" cy="48" r="25" fill="#18cfff"/><circle cx="62" cy="48" r="12" fill="#06143d"/>
 <text x="150" y="63" fill="#fff" font-family="Arial,sans-serif" font-size="64" font-weight="700">Visual <tspan fill="#30dfff">Eye</tspan></text>
 <text x="154" y="108" fill="#d7edff" font-family="Arial,sans-serif" font-size="27" font-style="italic">See more. Smile more.</text>
</g>
<text x="1365" y="95" text-anchor="end" fill="#aeeeff" font-family="Arial,sans-serif" font-size="24">YOUR AI VISION COMPANION</text>
<text x="720" y="210" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="32" font-weight="700">Two ways to experience Visual Eye</text>
<!-- Desktop app -->
<g transform="translate(90 270)">
 <rect x="0" y="0" width="800" height="390" rx="25" fill="#0b1c45" stroke="#39dfff" stroke-width="3" filter="url(#glow)"/>
